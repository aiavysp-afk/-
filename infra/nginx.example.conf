# EXAMPLE ONLY: choose and verify DNS/TLS before activation. Do not overwrite mtsc.top's current vhost.
# Put the admin behind a private VPN or an independent authenticated gateway.
server {
    listen 443 ssl;
    server_name zydj-api.mtsc.top;
    ssl_certificate /etc/letsencrypt/live/zydj-api.mtsc.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zydj-api.mtsc.top/privkey.pem;
    client_max_body_size 1m;
    location /v1/ {
        proxy_pass http://127.0.0.1:3210;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
}
