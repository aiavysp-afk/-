<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>中原到家 · 新版准备中</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Microsoft YaHei", system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f5ef;
        color: #245b4d;
        padding: 24px;
      }
      main {
        width: min(100%, 560px);
        padding: 52px 36px;
        border: 1px solid #d9e3db;
        border-radius: 24px;
        background: #fffdf8;
      }
      .brand {
        font-size: 18px;
        letter-spacing: 0.16em;
        margin: 0 0 40px;
      }
      h1 {
        font-size: clamp(28px, 6vw, 40px);
        margin: 0 0 20px;
        font-weight: 600;
      }
      p {
        font-size: 16px;
        line-height: 1.85;
        margin: 12px 0;
      }
      .muted {
        color: #65736a;
        font-size: 14px;
        margin-top: 32px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">中原到家</p>
      <h1>新版准备中</h1>
      <p>我们正在准备全新的上门按摩 SPA、足部舒缓与养生放松服务。</p>
      <p>商城暂时停止登录、预约和付款。开放时间将在新版发布后公布。</p>
      <p class="muted">感谢您的耐心等候。</p>
    </main>
  </body>
</html>
