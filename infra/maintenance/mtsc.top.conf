server {
    listen 80;
    listen [::]:80;
    server_name mtsc.top www.mtsc.top;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/mtsc.top/current/dist; }
    location / { return 301 https://mtsc.top$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mtsc.top www.mtsc.top;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/mtsc.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mtsc.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/zhongyuan-daojia-maintenance;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "3600" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    location ~ ^/(api|v1)(/|$) {
        default_type application/json;
        return 503 '{"message":"商城升级中，暂时停止交易","code":"MAINTENANCE"}';
    }
    location = /maintenance.html { internal; alias /var/www/zhongyuan-daojia-maintenance/index.html; }
    location / { error_page 503 /maintenance.html; return 503; }
    access_log /www/wwwlogs/mtsc.top.log;
    error_log /www/wwwlogs/mtsc.top.error.log warn;
}
