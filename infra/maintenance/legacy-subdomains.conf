server {
    listen 80;
    listen [::]:80;
    server_name api.mtsc.top admin.mtsc.top;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.mtsc.top admin.mtsc.top;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/api.mtsc.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mtsc.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "3600" always;
    location / {
        default_type application/json;
        return 503 '{"message":"商城升级中，旧系统已停用","code":"MAINTENANCE"}';
    }
}
