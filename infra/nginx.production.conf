    location ~ ^/v1/admin/organizations/[^/]+/technician-invitations/[^/]+/revoke$ {
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:3220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Customer-center administration remains limited to concrete
    # resources and never opens the rest of the customer-center namespace.
    location ~ ^/v1/admin/organizations/[^/]+/customer-center/config$ {
        limit_except GET PATCH OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:3220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ~ ^/v1/admin/organizations/[^/]+/customer-center/summary$ {
        limit_except GET OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:3220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Read-only financial ledger; the server-level private-network gate and API
    # finance permission, organization scope and fresh MFA checks still apply.
    location ~ ^/v1/admin/organizations/[^/]+/customer-center/wallet-ledger$ {
        if ($request_method != GET) { return 405; }
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        default_type application/json;
        return 404 '{"statusCode":404,"message":"Not Found"}';
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.mtsc.top;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/api.mtsc.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mtsc.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "3600" always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    client_max_body_size 1m;

    # Do not trust a caller-supplied X-Forwarded-For: geo uses the TCP peer.
    # The allowlist above is unchanged. Staff still need WeChat pairing + MFA.
    if ($zydj_admin_network_allowed = 0) { return 503 maintenance; }

    location / {
        proxy_pass http://127.0.0.1:3222;
        proxy_http_version 1.1;
        proxy_set_header Host admin.mtsc.top;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # No URI rewrite or Origin override: the adapter validates raw paths
        # and forwards the real browser HTTPS Origin unchanged.
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }
}
