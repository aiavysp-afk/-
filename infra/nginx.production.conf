    }

    location ~ ^/v1/admin/organizations/[^/]+/refunds/[^/]+/(?:approve|reject|submit|reconcile)$ {
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:3220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ~ ^/v1/admin/organizations/[^/]+/(?:safety-duty-rosters|safety-duty-staff/[^/]+/contact|safety-notifications/[^/]+/retry|safety-incidents/[^/]+/(?:acknowledge|close))$ {
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:3220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ~ ^/v1/admin/organizations/[^/]+/mfa-recovery-requests/[^/]+/(?:approve|reject)$ {
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:3220;
