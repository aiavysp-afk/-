# Production routing for the customer miniapp API. Install only after the
# certificate paths and local API port have been verified on the target host.
# Management API and MFA routes are available only from loopback/private
# networks. The admin UI uses the same existing trusted-private network gate;
# its public host remains in maintenance mode. No public identity bypass exists.
geo $zydj_admin_network_allowed {
    default 0;
    127.0.0.1/32 1;
    ::1/128 1;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
}

map "$zydj_admin_network_allowed:$uri" $zydj_admin_request_denied {
    default 0;
    ~^0:/v1/(?:admin/|auth/mfa(?:/|$)) 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.mtsc.top admin.mtsc.top;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    # Never redirect a capability over plain HTTP or record its URL.
    location ~* ^/v1/friend-payments(?:/|$) { access_log off; error_log /dev/null; return 404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.mtsc.top;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/api.mtsc.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mtsc.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    if ($zydj_admin_request_denied) { return 403; }

    location ~ ^/v1/(?:health|config/public|catalog/services(?:/[^/]+(?:/reviews)?)?|availability/slots)$ {
        proxy_pass http://127.0.0.1:3220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Only approved and published technician profiles/reviews are public.
    location ~ ^/v1/technicians(?:/[^/]+(?:/reviews|/photos/[A-Za-z0-9-]+)?)?$ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # A verified customer may claim a one-time technician invitation. The API
    # still enforces the active session, verified phone and invitation expiry.
    location = /v1/technician-invitations/claim {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:3220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ~ ^/v1/auth/(?:wechat-miniapp|wechat-phone|sms-phone/(?:request|confirm))$ {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:3220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Browser clients call api.mtsc.top cross-origin, so these exact
    # authentication resources also forward CORS preflight requests.
    location = /v1/auth/me {
        limit_except GET OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:3220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /v1/auth/logout {
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:3220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /v1/auth/browser-login/config {
        limit_except GET OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:3220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ~ ^/v1/auth/browser-login/(?:create|poll|claim|cancel)$ {
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:3220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # These pairing actions are called by the WeChat client, not the admin SPA.
    location ~ ^/v1/auth/browser-login/(?:inspect|approve)$ {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:3220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /v1/auth/mfa {
        limit_except GET OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:3220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ~ ^/v1/auth/mfa/(?:enrollment|activate|verify)$ {
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:3220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ~ ^/v1/(?:booking-holds(?:/[^/]+/release)?|locations/(?:address-suggestions|address-geocodes|address-verifications)|orders|orders/quote|orders/[^/]+|orders/[^/]+/(?:technician-location|cancel|confirm-completion))$ {
        proxy_pass http://127.0.0.1:3220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Authenticated customer-center reads. Authentication and customer ownership
    # remain enforced by the API; the gateway only exposes the exact route set.
    location ~ ^/v1/customer-center(?:/(?:coupons|wallet(?:/ledger)?|settings))?$ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /v1/customer-center/newcomer-coupons {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:3220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Only these exact writable wallet routes are exposed publicly.
    # Session ownership and idempotency remain enforced by the API.
    location ~ ^/v1/customer-center/wallet/(?:recharges(?:/[^/]+/reconcile)?|first-recharge-reward/claim)$ {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:3220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /v1/customer-center/addresses {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:3220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
