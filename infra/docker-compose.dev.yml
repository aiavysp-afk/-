services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: zhongyuan
      POSTGRES_PASSWORD: local_only
      POSTGRES_DB: zhongyuan_daojia
    ports:
      - "5432:5432"
    volumes:
      - zydj_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhongyuan -d zhongyuan_daojia"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.5-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - zydj_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  zydj_postgres:
  zydj_redis:
