openapi: 3.1.0
info:
  title: 中原到家 API
  version: 0.11.0
  description: M2 开发接口；金额单位固定为人民币分。
servers:
  - url: http://localhost:3100
    description: 本地开发
paths:
  /v1/auth/browser-login/config:
    get:
      summary: 获取登录交接开关与明确provider标签
      responses:
        "200":
          {
            description: enabled/provider/audience/固定三分钟期限，无秘密且no-store,
          }
  /v1/auth/browser-login/create:
    post:
      summary: 发起一次性后台配对，默认门禁关闭
      description: 生产必须精确受信HTTPS Origin；只有真实socket peer用于共享限流。不得传身份/角色/redirect。
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200":
          {
            description: 一次性pairCode/browserSecret/confirmationCode/expiresAt，no-store；秘密只留原电脑,
          }
        "400": { description: 参数错误 }
        "403": { description: 不可信Origin }
        "429": { description: 持久化创建限流 }
        "503": { description: 门禁关闭 }
  /v1/auth/browser-login/inspect:
    post:
      summary: 手机新微信会话核验配对，不回显核对数字或设备秘密
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pairCode]
              properties:
                { pairCode: { type: string, pattern: "^[A-Za-z0-9_-]{22}$" } }
      responses:
        "200":
          {
            description: 固定audience/createdAt/expiresAt/provider，无身份秘密，no-store,
          }
        "401": { description: 非五分钟新小程序会话或过期配对 }
        "403": { description: 客户或无有效staff资格 }
        "409": { description: 配对已处理 }
        "429": { description: 核验限流 }
  /v1/auth/browser-login/approve:
    post:
      summary: 手机明确批准本人的电脑配对，不能批准自带的角色或回调
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pairCode, confirmationCode]
              properties:
                pairCode: { type: string, pattern: "^[A-Za-z0-9_-]{22}$" }
                confirmationCode: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200": { description: approved=true，无会话令牌，no-store }
        "400": { description: 严格参数错误 }
        "401":
          { description: 无效源会话/核对错误/到期，错误次数持久化；五次取消 }
        "403": { description: 无staff资格 }
        "409": { description: 已批准/取消/消费 }
        "429": { description: 核验限流 }
  /v1/auth/browser-login/poll:
    post:
      summary: 原电脑持有高熵秘密查询配对状态，两秒间隔
      requestBody: { $ref: "#/components/requestBodies/BrowserLoginProof" }
      responses:
        "200": { description: 只有status，不泄露身份/token/核对数字，no-store }
        "401": { description: 凭证或期限无效 }
        "403": { description: Origin不可信 }
        "429": { description: 轮询过快 }
  /v1/auth/browser-login/claim:
    post:
      summary: 原电脑仅一次领取全新后台会话，重新核验手机来源身份
      description: 最多一小时，不继承手机MFA；领取响应丢失不能重发令牌，须重新配对。
      requestBody: { $ref: "#/components/requestBodies/BrowserLoginProof" }
      responses:
        "200":
          description: 一次性新AuthSession，no-store
          content:
            application/json:
              schema:
                type: object
                properties:
                  { data: { $ref: "#/components/schemas/AuthSession" } }
        "401": { description: 源微信会话失效/陈旧/来源错误或设备秘密无效 }
        "403": { description: staff资格已撤销或Origin不可信 }
        "409": { description: 未批准/已领取/已取消 }
  /v1/auth/browser-login/cancel:
    post:
      summary: 原电脑取消本次配对，不注销已经领取的会话
      requestBody: { $ref: "#/components/requestBodies/BrowserLoginProof" }
      responses:
        "200": { description: cancelled=true，无令牌，no-store }
        "401": { description: 凭证或期限无效 }
        "403": { description: Origin不可信 }
        "409": { description: 已领取，应独立注销电脑会话 }
  /v1/health:
    get:
      summary: 存活检查
      responses:
        "200":
          description: 服务存活
  /v1/config/public:
    get:
      summary: 获取无秘密的公开配置
      responses:
        "200":
          description: 公开配置
  /v1/catalog/services:
    get:
      summary: 获取已发布服务目录
      responses:
        "200":
          description: 服务列表
  /v1/catalog/services/{slug}:
    get:
      summary: 按 slug 获取服务详情
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200": { description: 服务详情 }
        "404": { description: 服务不存在或未上架 }
  /v1/auth/wechat-miniapp:
    post:
      summary: 使用微信小程序一次性 code 登录
      description: 角色、用户 ID 和组织范围完全由服务端确定。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AuthSession" }
        "400": { description: 参数错误 }
        "401": { description: 微信 code 无效或过期 }
        "503": { description: 微信登录服务暂不可用 }
  /v1/auth/wechat-phone:
    post:
      summary: 使用微信官方手机号授权凭证完成绑定
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200": { description: 手机号验证成功 }
        "400": { description: 参数错误 }
        "401": { description: 未登录或微信凭证无效 }
        "503": { description: 微信手机号服务暂不可用 }
  /v1/auth/sms-phone/request:
    post:
      summary: 申请手机号绑定短信验证码（备用通道）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone]
              properties:
                phone: { type: string, pattern: '^1[3-9]\\d{9}$' }
      responses:
        "200": { description: 请求已受理或状态待确认 }
        "400": { description: 手机号格式错误 }
        "409": { description: 已完成绑定 }
        "429": { description: 请求频率超限 }
        "503": { description: 短信通道未启用或暂不可用 }
  /v1/auth/sms-phone/confirm:
    post:
      summary: 校验短信验证码并绑定手机号
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone, code]
              properties:
                phone: { type: string, pattern: '^1[3-9]\\d{9}$' }
                code: { type: string, pattern: '^\\d{4,6}$' }
      responses:
        "200": { description: 手机号验证成功 }
        "400": { description: 验证码错误或过期 }
        "409": { description: 绑定状态已变化 }
        "429": { description: 尝试次数超限 }
  /v1/auth/me:
    get:
      summary: 获取当前身份与组织角色
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 当前身份 }
        "401": { description: 未登录或会话失效 }
  /v1/auth/logout:
    post:
      summary: 注销当前设备会话
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 已注销 }
        "401": { description: 未登录或会话失效 }
  /v1/auth/mfa:
    get:
      summary: 本人MFA绑定及当前会话状态，不返回密钥
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 无缓存的本人状态 }
        "401": { description: 未登录或会话失效 }
  /v1/auth/mfa/enrollment:
    post:
      summary: 新鲜微信会话下开始工作人员验证器绑定
      description: 只返回一次随机密钥，十分钟到期；已启用验证器禁止直接替换。
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200": { description: 密钥和绑定期限，Cache-Control no-store }
        "400": { description: 参数错误 }
        "401": { description: 会话非新鲜、失效或锁定 }
        "403": { description: 没有有效工作人员资格 }
        "409": { description: 已绑定或已有待激活绑定 }
  /v1/auth/mfa/activate:
    post:
      summary: 同一会话确认绑定，提升本会话权限最多五分钟
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200": { description: 当前会话MFA有效期，不超过原会话期限 }
        "400": { description: 参数错误 }
        "401": { description: 会话、动态码、绑定期限或锁定无效 }
        "403": { description: 无工作人员资格 }
        "409": { description: 绑定状态冲突 }
  /v1/auth/mfa/verify:
    post:
      summary: 验证已绑定的动态码，跨会话/跨实例不可重放
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200": { description: 当前会话MFA有效期 }
        "400": { description: 参数错误 }
        "401": { description: 无效/重放动态码、会话或五次失败锁定 }
        "403": { description: 无工作人员资格 }
        "409": { description: 尚未完成绑定 }
  /v1/auth/mfa/recovery-requests:
    post:
      summary: 本人用五分钟内的新微信小程序会话申请恢复丢失的验证器
      description: 必须有有效工作人员membership和已启用旧因子；每人一笔待复核、30分钟到期、24小时最多三次。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [organizationId]
              properties:
                organizationId: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200": { description: 待复核申请，Cache-Control no-store }
        "400": { description: 严格参数错误 }
        "401": { description: 会话失效、非新鲜或不是当前微信provider }
        "403": { description: 不属于该组织的有效工作人员 }
        "409": { description: 无已启用因子或已有待复核申请 }
        "429": { description: 24小时申请次数已达三次 }
    get:
      summary: 获取本人最近十笔验证器恢复申请
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 恢复申请列表，Cache-Control no-store }
        "401": { description: 会话失效 }
  /v1/auth/mfa/recovery-requests/{requestId}/cancel:
    post:
      summary: 由发起申请的原会话取消待复核申请
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: path,
            name: requestId,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200": { description: CANCELLED或EXPIRED终态，Cache-Control no-store }
        "401": { description: 不是原申请会话或会话失效 }
        "404": { description: 申请不存在或不属于本人 }
        "409": { description: 申请已处理 }
  /v1/admin/organizations/{organizationId}/mfa-recovery-requests:
    get:
      summary: 同组织ADMIN读取恢复复核队列
      description: 当前管理员会话必须已完成MFA；返回最近50笔，不返回会话令牌或验证器秘密。
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: path,
            name: organizationId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: 恢复申请列表，Cache-Control no-store }
        "401": { description: 会话失效 }
        "403": { description: 非同组织ADMIN或当前会话未完成MFA }
  /v1/admin/organizations/{organizationId}/mfa-recovery-requests/{requestId}/approve:
    post:
      summary: 异人复核通过并原子撤销申请人的旧因子和全部会话
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: path,
            name: organizationId,
            required: true,
            schema: { type: string },
          }
        - {
            in: path,
            name: requestId,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200": { description: APPROVED终态和撤销会话数，Cache-Control no-store }
        "403": { description: 自审、非同组织ADMIN、未MFA或申请人资格失效 }
        "404": { description: 申请不存在或组织不匹配 }
        "409": { description: 已处理、已过期、来源会话或旧因子已变化 }
  /v1/admin/organizations/{organizationId}/mfa-recovery-requests/{requestId}/reject:
    post:
      summary: 异人复核拒绝并保留申请人的旧因子和会话
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: path,
            name: organizationId,
            required: true,
            schema: { type: string },
          }
        - {
            in: path,
            name: requestId,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reasonCode]
              properties:
                reasonCode:
                  type: string
                  enum:
                    [
                      IDENTITY_NOT_CONFIRMED,
                      REQUEST_NOT_EXPECTED,
                      POLICY_REVIEW_REQUIRED,
                    ]
      responses:
        "200": { description: REJECTED终态，Cache-Control no-store }
        "400": { description: 严格参数或原因码错误 }
        "403": { description: 自审、非同组织ADMIN、未MFA或申请人资格失效 }
        "404": { description: 申请不存在或组织不匹配 }
        "409": { description: 已处理、已过期、来源会话或旧因子已变化 }
  /v1/admin/audit-logs:
    get:
      summary: 按当前工作人员 membership 范围读取审计摘要
      description: organizationId 可选；传入其他组织时返回 403，响应不包含 metadata 中的敏感上下文。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: organizationId
          schema: { type: string }
      responses:
        "200": { description: 授权组织内最近 50 条审计摘要 }
        "401": { description: 未登录或会话失效 }
        "403": { description: 无审计权限或跨组织访问 }
  /v1/admin/catalog/services:
    get:
      summary: 获取当前运营身份可管理的服务目录
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: organizationId
          schema: { type: string }
      responses:
        "200":
          description: 包含已上架及已下架项目
        "401": { description: 未登录或会话失效 }
        "403": { description: 无目录管理权限或跨组织访问 }
  /v1/admin/catalog/services/{id}:
    patch:
      summary: 编辑服务项目
      description: 至少提供一个字段；priceFen 必须为整数人民币分。成功后写入审计日志。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceAdminUpdate" }
      responses:
        "200": { description: 已更新 }
        "400": { description: 参数错误 }
        "401": { description: 未登录或会话失效 }
        "403": { description: 无目录管理权限或跨组织访问 }
        "404": { description: 服务不存在 }
  /v1/admin/catalog/services/{id}/publish:
    post:
      summary: 上架服务项目
      description: 上架前校验项目资料完整性；状态变化会写入审计日志。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 已上架或原本已上架 }
        "401": { description: 未登录或会话失效 }
        "403": { description: 无目录管理权限、跨组织访问或资料不完整 }
        "404": { description: 服务不存在 }
  /v1/admin/catalog/services/{id}/unpublish:
    post:
      summary: 下架服务项目
      description: 状态变化会写入审计日志。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 已下架或原本已下架 }
        "401": { description: 未登录或会话失效 }
        "403": { description: 无目录管理权限或跨组织访问 }
        "404": { description: 服务不存在 }
  /v1/availability/slots:
    get:
      summary: 查询服务在指定日期的可预约时段
      description: 当前首发时区固定为 Asia/Shanghai，时段按 30 分钟递进。
      parameters:
        - in: query
          name: serviceId
          required: true
          schema: { type: string }
        - in: query
          name: date
          required: true
          schema: { type: string, format: date, example: "2026-10-04" }
        - in: query
          name: timeZone
          schema:
            { type: string, enum: [Asia/Shanghai], default: Asia/Shanghai }
      responses:
        "200":
          description: 当前可用时段；不包含有效占位或已确认预约覆盖的区间
        "400": { description: 日期或查询参数无效 }
        "404": { description: 服务不存在或未上架 }
  /v1/booking-holds:
    post:
      summary: 为当前用户创建十分钟预约占位
      description: 结束时间由服务时长计算；数据库互斥约束保证同一技师同一时间只能成功一个占位。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingHoldCreate" }
      responses:
        "201": { description: 占位创建成功 }
        "400": { description: 时间未对齐、不在班次内或超出预约范围 }
        "401": { description: 未登录或会话失效 }
        "404": { description: 服务不存在或未上架 }
        "409": { description: 时段刚刚被其他请求占用 }
  /v1/locations/address-suggestions:
    get:
      summary: 在服务器配置的服务城市内查询地址提示
      description: 必须登录；客户端不能指定城市。服务端持久化执行每用户与全局分钟/日配额，地图门禁关闭时不写配额且不外呼。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: keyword
          required: true
          schema: { type: string, minLength: 2, maxLength: 32 }
      responses:
        "200":
          description: 最多十条普通 POI；GCJ-02 坐标仅用于辅助填写
        "400": { description: 关键词无效或包含额外查询参数 }
        "401": { description: 未登录或会话失效 }
        "429": { description: 用户或全局地址查询配额已达上限 }
        "502": { description: 地图渠道响应无效或暂不可用 }
        "503": { description: 地图渠道、凭据或独立门禁未就绪 }
  /v1/locations/address-verifications:
    post:
      summary: 为当前用户的有效预约占位核验服务地址
      description: 服务端用高德逆解析 GCJ-02 坐标并执行持久化配额；拒绝服务行政区白名单外的地址。返回的短期凭证绑定用户、预约、地址摘要、坐标及占位到期时间。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressVerificationCreate" }
      responses:
        "201":
          description: 地址核验通过；凭证不晚于预约占位到期
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AddressVerification" }
        "400": { description: 参数无效或包含额外字段 }
        "401": { description: 未登录或会话失效 }
        "403": { description: 预约占位不属于当前用户 }
        "404": { description: 预约占位不存在 }
        "409": { description: 预约占位已经结束或过期 }
        "422": { description: 地址精度不足或不在已配置服务范围 }
        "429": { description: 用户或全局地址核验配额已达上限 }
        "502": { description: 地图渠道响应无效或暂不可用 }
        "503": { description: 地图渠道、凭据、服务区或独立门禁未就绪 }
  /v1/booking-holds/{id}/release:
    post:
      summary: 释放当前用户自己的预约占位
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 占位已释放 }
        "401": { description: 未登录或会话失效 }
        "403": { description: 不能释放其他用户的占位 }
        "404": { description: 占位不存在 }
        "409": { description: 占位状态已经结束或变化 }
  /v1/admin/scheduling/shifts:
    get:
      summary: 查询组织指定日期的技师排班
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: organizationId
          required: true
          schema: { type: string }
        - in: query
          name: date
          required: true
          schema: { type: string, format: date }
      responses:
        "200": { description: 授权组织内的排班 }
        "400": { description: 查询参数无效 }
        "401": { description: 未登录或会话失效 }
        "403": { description: 无排班权限或跨组织访问 }
    post:
      summary: 新建技师排班
      description: 仅 DISPATCHER 或所属组织 ADMIN；数据库拒绝同一技师的重叠班次。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShiftCreate" }
      responses:
        "201": { description: 排班创建成功 }
        "400": { description: 参数无效或技师不属于组织 }
        "401": { description: 未登录或会话失效 }
        "403": { description: 无排班权限或跨组织访问 }
        "409": { description: 技师已有重叠排班 }
  /v1/orders/quote:
    post:
      summary: 根据当前用户的预约占位计算服务端报价
      description: 使用创建占位时冻结的服务价格；不接受客户端金额。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reservationId]
              properties:
                reservationId: { type: string }
      responses:
        "201":
          description: 报价成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/OrderQuote" }
        "401": { description: 未登录或会话失效 }
        "403": { description: 预约占位不属于当前用户 }
        "404": { description: 预约占位不存在 }
        "409": { description: 预约占位已经结束或过期 }
  /v1/orders:
    get:
      summary: 获取当前用户最近 50 笔订单
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 本人订单列表 }
        "401": { description: 未登录或会话失效 }
    post:
      summary: 从有效预约占位幂等创建订单
      description: 金额、技师和服务时长均由服务端快照；地址加密保存。地图核验门禁开启时必须携带与当前用户、预约和精确地址绑定的有效核验凭证。相同幂等键仅允许相同请求重放。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderCreate" }
      responses:
        "201":
          description: 首次创建或幂等重放；通过 meta.idempotentReplay 区分
        "400": { description: 下单参数或幂等键无效 }
        "401": { description: 未登录或会话失效 }
        "403": { description: 预约占位不属于当前用户 }
        "404": { description: 预约占位不存在 }
        "409": { description: 占位过期、状态冲突或幂等键复用冲突 }
        "422": { description: 地址核验缺失、失效或与订单不一致 }
  /v1/orders/{id}:
    get:
      summary: 获取当前用户的一笔订单
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 订单详情，不返回加密地址原文 }
        "401": { description: 未登录或会话失效 }
        "403": { description: 不能查看其他用户订单 }
        "404": { description: 订单不存在 }
  /v1/orders/{id}/technician-location:
    get:
      summary: 查看本人订单的技师位置状态
      description: 仅在订单已出发或已到达阶段返回最近一次 GCJ-02 位置；超过 5 分钟标记为 STALE，其他阶段不披露坐标。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 技师位置状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    { $ref: "#/components/schemas/CustomerTechnicianLocation" }
        "401": { description: 未登录或会话失效 }
        "403": { description: 不能查看其他用户订单 }
        "404": { description: 订单不存在 }
  /v1/orders/{id}/cancel:
    post:
      summary: 取消当前用户自己的待支付订单
      description: 订单、预约占位、订单事件、审计和 Outbox 在同一事务更新；重复取消幂等成功。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 已取消 }
        "401": { description: 未登录或会话失效 }
        "403": { description: 不能取消其他用户订单 }
        "404": { description: 订单不存在 }
        "409": { description: 当前订单状态不允许取消 }
  /v1/technician/workbench/location:
    post:
      summary: 技师上报本人当前位置
      description: 浏览器定位先转换为 GCJ-02；仅已授权技师可上报，后续路线计算只接受 5 分钟内的位置。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TechnicianLocationReport" }
      responses:
        "201":
          description: 位置已记录
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    {
                      $ref: "#/components/schemas/TechnicianLocationReportResult",
                    }
        "400": { description: 坐标参数无效 }
        "401": { description: 未登录或会话失效 }
        "403": { description: 当前身份不是已授权技师 }
  /v1/technician/workbench/orders/{orderId}/route:
    get:
      summary: 计算技师到本人订单上门地址的驾车路线
      description: 仅已指派技师和 ASSIGNED/EN_ROUTE/ARRIVED 状态可用；服务端用高德 Web 服务 Key 返回距离与预计时长，不返回 Key 或原始渠道错误体。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 高德驾车距离和预计时长
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/TechnicianRoute" }
        "401": { description: 未登录或会话失效 }
        "403": { description: 订单未指派给当前技师 }
        "404": { description: 订单不存在 }
        "409": { description: 状态不允许、地址坐标缺失或位置已过期 }
        "429": { description: 调用过于频繁或高德配额超限 }
        "502": { description: 高德响应或网络异常 }
        "503": { description: 地图门禁、Key 或平台配置未就绪 }
  /v1/orders/{id}/payment-intent:
    post:
      summary: 为当前用户的待支付订单创建支付意图
      description: 每个订单最多一条支付记录。MOCK仅限非生产。微信预下单需显式开启门禁并使用微信身份；先持久化DISPATCHING再签名POST，READY返回RSA调起参数，DISPATCHING/UNKNOWN/遗留NONE只返回原记录，不重新POST。最终支付状态以验签通知/查单为准。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "201":
          description: 支付意图创建成功或返回已有支付意图
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PaymentIntent" }
        "401": { description: 未登录或会话失效 }
        "403": { description: 不能支付其他用户订单 }
        "404": { description: 订单不存在 }
        "409": { description: 订单状态不允许支付或支付已超时 }
        "502":
          { description: 预下单结果未确认，保留原单并人工查单，禁止自动重发 }
        "503": { description: 微信预下单开关关闭、微信身份或签名配置未就绪 }
  /v1/payments/orders/{id}/close:
    post:
      summary: 客户申请原单取消并核实微信关闭状态
      description: 无支付或Mock走已有本地取消；微信需独立补偿门禁。持久化意图后查原单、幂等关单、再次查单；只有验签CLOSED才释放预约。返回data.order、pendingConfirmation及reviewRequired。SDK取消不自动调用此接口。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 最新订单与待核实标识；不能把HTTP成功等同于已取消 }
        "401": { description: 会话失效 }
        "403": { description: 非本人订单 }
        "404": { description: 订单不存在 }
        "409": { description: 状态已变化；已到账需申请退款 }
        "503": { description: 原单补偿门禁未开启或签名材料未就绪 }
  /v1/dev/payments/{id}/succeed:
    post:
      summary: 在本地开发模式确认 Mock 支付成功
      description: 仅 NODE_ENV 非 production 且 PAYMENT_PROVIDER=mock 时存在；生产环境固定返回 404。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "201":
          description: 支付成功或幂等返回已成功记录；订单转 PAID，预约转 CONFIRMED
        "401": { description: 未登录或会话失效 }
        "403": { description: 不能确认其他用户支付 }
        "404": { description: 生产环境隐藏接口或支付记录不存在 }
        "409": { description: 支付超时、金额不一致或状态冲突 }
  /v1/payments/wechat/notify:
    post:
      summary: 微信支付成功通知
      description: 仅微信支付模式可用；以原始报文字节验签，解密后核对 AppID、商户号、交易类型、金额和流水。成功或幂等重复返回空 204；晚到款记录待处理事件，不恢复失效预约。
      parameters:
        - {
            in: header,
            name: Wechatpay-Timestamp,
            required: true,
            schema: { type: string },
          }
        - {
            in: header,
            name: Wechatpay-Nonce,
            required: true,
            schema: { type: string },
          }
        - {
            in: header,
            name: Wechatpay-Serial,
            required: true,
            schema: { type: string },
          }
        - {
            in: header,
            name: Wechatpay-Signature,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, event_type, resource_type, resource]
              properties:
                id: { type: string }
                event_type: { const: TRANSACTION.SUCCESS }
                resource_type: { const: encrypt-resource }
                resource:
                  type: object
                  required: [original_type, algorithm, ciphertext, nonce]
                  properties:
                    original_type: { const: transaction }
                    algorithm: { const: AEAD_AES_256_GCM }
                    ciphertext: { type: string }
                    nonce: { type: string }
                    associated_data: { type: string }
      responses:
        "204": { description: 已在数据库提交成功或确认幂等重复 }
        "400": { description: 格式、解密或交易身份校验失败 }
        "401": { description: 缺失签名、过期时间戳、错误公钥 ID 或验签失败 }
        "404": { description: Mock 模式或未找到微信支付记录 }
        "409": { description: 金额、流水、事件 ID 或预约状态冲突 }
        "500": { description: 数据库提交未成功，渠道应重试 }
        "503": { description: 验签配置未就绪 }
  /v1/payments/{id}/reconcile:
    post:
      summary: 主动核实本人微信支付结果
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: 已验签查单；成功交易使用通知相同的原子状态补偿
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      status: { type: string }
                      providerState: { type: string }
                      fulfillmentReviewRequired: { type: boolean }
        "401": { description: 未登录 }
        "403": { description: 支付不属于本人 }
        "404": { description: 支付不存在或当前为 Mock 模式 }
        "409": { description: 非微信支付或查单结果与本地不一致 }
        "502": { description: 网络、渠道接口或响应验签失败 }
        "503": { description: 商户签名或验签材料未就绪 }
  /v1/admin/organizations/{organizationId}/payments/reconciliation/{date}:
    post:
      summary: 核对指定组织已结束日期的微信交易账单
      description: 需要本组织 finance.approve 权限；校验元数据签名和文件 SHA1，生成差异报告并写审计。退款行需进一步查原退款号。商户范围存在不能归属本组织的行时只返回处理标志，不披露跨组织流水。
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: path,
            name: organizationId,
            required: true,
            schema: { type: string },
          }
        - {
            in: path,
            name: date,
            required: true,
            schema: { type: string, format: date },
            description: 北京时间日期,
          }
      responses:
        "200":
          description: 核对完成，报告不修改支付或退款状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      date: { type: string, format: date }
                      organizationId: { type: string }
                      fileHash: { type: string }
                      matched: { type: boolean }
                      channelPaidFen:
                        { type: string, description: 整数分字符串 }
                      channelFeeFen:
                        {
                          type: string,
                          description: 含退款负手续费的整数分字符串,
                        }
                      merchantScopeReviewRequired: { type: boolean }
                      differences:
                        type: array
                        items:
                          type: object
                          properties:
                            merchantPaymentNo: { type: string }
                            kind: { type: string }
                            channelFen: { type: string }
                            localFen: { type: string }
        "400": { description: 日期、账单格式、解压或当前容量限制 }
        "401": { description: 未登录 }
        "403": { description: 不具备指定组织的财务复核权限 }
        "404": { description: Mock 模式 }
        "502": { description: 渠道、验签、文件摘要或大小校验失败 }
        "503": { description: 商户签名或验签材料未就绪 }
  /v1/orders/{orderId}/refunds:
    parameters:
      - { in: path, name: orderId, required: true, schema: { type: string } }
    get:
      summary: 查看本人订单退款记录
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 本人退款记录列表 }
        "403": { description: 非本人订单 }
    post:
      summary: 客户申请开始前剩余额度全退（金额原因服务端判定）
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: header,
            name: Idempotency-Key,
            required: true,
            schema: { type: string, minLength: 16, maxLength: 128 },
          }
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "201": { description: 申请或幂等重放，REQUESTED不代表到账 }
        "409": { description: 额度或履约状态不允许退款 }
  /v1/admin/organizations/{organizationId}/payments:
    get:
      summary: 财务权限读取最近50笔支付预算
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: path,
            name: organizationId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          { description: 支付/订单状态、已退、占用、余额（余额不保证退款资格） }
        "403": { description: 缺少组织财务权限 }
  /v1/admin/organizations/{organizationId}/payments/{paymentId}/refunds:
    parameters:
      - {
          in: path,
          name: organizationId,
          required: true,
          schema: { type: string },
        }
      - { in: path, name: paymentId, required: true, schema: { type: string } }
    get:
      summary: 财务查看退款和状态事件
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 退款、申请/复核身份与事件 }
    post:
      summary: 财务申请全额退款，finance.request，金额服务端计算
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: header,
            name: Idempotency-Key,
            required: true,
            schema: { type: string, minLength: 16, maxLength: 128 },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  { enum: [CUSTOMER_CANCELLED, UNFULFILLABLE, LATE_PAYMENT] }
      responses:
        "201": { description: 申请已占用额度或同键重放 }
        "400": { description: 拒绝额外金额/身份字段 }
        "403": { description: 无组织财务申请权限 }
        "409": { description: 规则/额度/幂等冲突 }
  /v1/admin/organizations/{organizationId}/refunds/{id}/{action}:
    post:
      summary: 独立财务复核、提交或原单查单
      description: approve/reject需严格结论code；submit/reconcile空对象。申请人不能复核或提交，ADMIN同样受限。UNKNOWN保留额度，禁止另建退款号。
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: path,
            name: organizationId,
            required: true,
            schema: { type: string },
          }
        - { in: path, name: id, required: true, schema: { type: string } }
        - {
            in: path,
            name: action,
            required: true,
            schema: { enum: [approve, reject, submit, reconcile] },
          }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                code:
                  {
                    enum:
                      [
                        CONFIRMED,
                        INSUFFICIENT_EVIDENCE,
                        DUPLICATE_REQUEST,
                        POLICY_REVIEW_REQUIRED,
                      ],
                  }
      responses:
        "200": { description: 原退款当前状态，不必然成功 }
        "403": { description: 自审/自行提交或无组织权限 }
        "409": { description: 状态/规则/额度已变化 }
        "503":
          { description: 真实门禁关闭或渠道不确定；不确定已占用额度并转UNKNOWN }
  /v1/admin/organizations/{organizationId}/safety-duty-rosters:
    post:
      summary: 配置新的安全值班主岗和备岗
      description: 仅组织ADMIN；主备必须是不同且有效的SAFETY_DUTY成员。新配置原子停用旧配置并写审计。
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: path,
            name: organizationId,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SafetyDutyRosterUpsert" }
      responses:
        "201": { description: 新的唯一活动值班表 }
        "400": { description: 主备相同、成员无效或超时时间越界 }
        "403": { description: 无组织身份管理权限 }
  /v1/admin/organizations/{organizationId}/safety-duty-rosters/current:
    get:
      summary: 读取本组织当前安全值班主备岗
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: path,
            name: organizationId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: 当前活动值班表或null }
        "403": { description: 无本组织安全响应权限 }
  /v1/admin/organizations/{organizationId}/safety-duty-staff:
    get:
      summary: 管理员读取本组织有效安全值班候选人
      description: 只返回有效SAFETY_DUTY成员的内部ID和显示名，用于主备岗选择；普通值班人员无权读取。
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: path,
            name: organizationId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: 有效候选人列表 }
        "403": { description: 无组织身份管理权限 }
  /v1/admin/organizations/{organizationId}/safety-duty-staff/{userId}/contact:
    post:
      summary: 管理员配置安全值班人员短信号码
      description: 号码仅在服务端加密保存；接口和后续列表只返回是否已配置，不回显号码。
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: path,
            name: organizationId,
            required: true,
            schema: { type: string },
          }
        - { in: path, name: userId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SafetyDutyContactUpdate" }
      responses:
        "201": { description: 联系号码已加密保存 }
        "403": { description: 无组织身份管理权限 }
        "404": { description: 不是本组织有效安全值班人员 }
  /v1/admin/organizations/{organizationId}/safety-notifications:
    get:
      summary: 读取安全事件通知Outbox状态
      description: 渠道接受不等于手机送达；不返回号码、模板内容或渠道跟踪标识。
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: path,
            name: organizationId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          description: 最多200条本组织安全通知状态
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SafetyNotificationView" }
        "403": { description: 无本组织安全响应权限 }
  /v1/admin/organizations/{organizationId}/safety-notifications-summary:
    get:
      summary: 读取安全通知积压、死信与送达监控摘要
      description: 超过5分钟未投递、超过15分钟未取得回执、死信、送达失败或最终未知会触发attentionRequired；不返回手机号、正文或渠道标识。
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: path,
            name: organizationId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          description: 本组织安全通知监控摘要
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SafetyNotificationSummary" }
        "403": { description: 无本组织安全响应权限 }
  /v1/admin/organizations/{organizationId}/safety-notifications/{id}/retry:
    post:
      summary: 管理员人工复核后重试死信安全通知
      description: 只允许重置DEAD_LETTER；已被渠道接受或仍在等待的通知不能重发。
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: path,
            name: organizationId,
            required: true,
            schema: { type: string },
          }
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "201": { description: 通知已回到等待投递状态并写入审计 }
        "403": { description: 无组织身份管理权限 }
        "404": { description: 通知不存在或不属于本组织 }
        "409": { description: 通知不是可人工重试的死信状态 }
  /v1/orders/{orderId}/safety-incidents:
    parameters:
      - { in: path, name: orderId, required: true, schema: { type: string } }
    post:
      summary: 客户为自己的履约中订单发起安全事件
      description: 事件只持久化并写Outbox；接口成功不代表已联系主岗、备岗、电话或公共应急服务。
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: header,
            name: Idempotency-Key,
            required: true,
            schema: { type: string, minLength: 16, maxLength: 128 },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SafetyIncidentCreate" }
      responses:
        "201": { description: 事件已记录或同键同请求重放 }
        "403": { description: 非订单本人 }
        "409": { description: 订单阶段或幂等指纹冲突 }
        "503": { description: 未配置活动值班主备岗 }
    get:
      summary: 客户读取本人订单的安全事件
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 最多50条本人事件 }
        "403": { description: 非订单本人 }
  /v1/admin/organizations/{organizationId}/safety-incidents:
    get:
      summary: 安全值班人员读取本组织最近安全事件
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: path,
            name: organizationId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: 最多100条组织内安全事件 }
        "403": { description: 无本组织安全响应权限 }
  /v1/admin/organizations/{organizationId}/safety-incidents/{id}/acknowledge:
    post:
      summary: 值班人员确认安全事件
      description: 截止前仅主岗；超时后原子升级且仅备岗。重复确认只对原确认人幂等。
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: path,
            name: organizationId,
            required: true,
            schema: { type: string },
          }
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "201": { description: 已确认事件 }
        "403": { description: 当前人员不是该阶段允许的响应人 }
        "409": { description: 已关闭或已由其他人员确认 }
  /v1/admin/organizations/{organizationId}/safety-incidents/{id}/close:
    post:
      summary: 原确认人使用固定结论码关闭安全事件
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: path,
            name: organizationId,
            required: true,
            schema: { type: string },
          }
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SafetyIncidentClose" }
      responses:
        "201": { description: 已关闭或原关闭结果幂等返回 }
        "403": { description: 非该事件原确认人 }
        "409": { description: 事件尚未确认 }
  /v1/payments/wechat/refund-notify:
    post:
      summary: 微信退款原始字节验签及解密通知
      security: []
      parameters:
        - {
            in: header,
            name: Wechatpay-Timestamp,
            required: true,
            schema: { type: string },
          }
        - {
            in: header,
            name: Wechatpay-Nonce,
            required: true,
            schema: { type: string },
          }
        - {
            in: header,
            name: Wechatpay-Serial,
            required: true,
            schema: { type: string },
          }
        - {
            in: header,
            name: Wechatpay-Signature,
            required: true,
            schema: { type: string },
          }
      responses:
        "204": { description: 提交成功或同笔重复通知，空响应 }
        "400": { description: 原始报文/解密/身份无效 }
        "401": { description: 验签失败 }
        "409": { description: 金额/支付流水不一致或退款未提交 }
  /v1/dev/organizations/{organizationId}/refunds/{id}/succeed:
    post:
      summary: 独立复核人确认本地Mock成功，production固定404
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: path,
            name: organizationId,
            required: true,
            schema: { type: string },
          }
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200": { description: 模拟成功或幂等重复 }
        "404": { description: 非Mock/生产禁止 }
  /v1/customer-center:
    get:
      summary: 获取当前客户个人中心聚合数据
      description: 仅返回当前会话客户自身数据。organizationId 可省略；显式组织必须有已发布服务或该客户的历史订单。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: organizationId
          required: false
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: 个人中心资料、订单计数、脱敏余额与运营内容
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/CustomerCenterOverview" }
        "401": { description: 未登录 }
        "403": { description: 显式组织不属于可用客户服务范围 }
  /v1/customer-center/coupons:
    get:
      summary: 获取当前客户优惠券
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: query,
            name: organizationId,
            required: false,
            schema: { type: string },
          }
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [AVAILABLE, USED, EXPIRED] }
      responses:
        "200": { description: 只返回当前客户真实券数据，不自动创建演示券 }
        "401": { description: 未登录 }
  /v1/customer-center/wallet:
    get:
      summary: 获取当前客户储值账户与卡片
      description: 只读真实账面数据；recharge.enabled 固定为 false，本接口不提供充值写入能力。
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: query,
            name: organizationId,
            required: false,
            schema: { type: string },
          }
        - {
            in: query,
            name: status,
            required: false,
            schema: { type: string, enum: [AVAILABLE, UNAVAILABLE] },
          }
        - {
            in: query,
            name: type,
            required: false,
            schema:
              { type: string, enum: [PHYSICAL, DISCOUNT_93, DISCOUNT_90] },
          }
      responses:
        "200":
          description: 当前客户储值账户
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/CustomerWallet" }
  /v1/customer-center/wallet/ledger:
    get:
      summary: 获取当前客户储值账单明细
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: query,
            name: organizationId,
            required: false,
            schema: { type: string },
          }
      responses:
        "200": { description: 最多返回当前客户最近 100 条真实账单 }
  /v1/customer-center/settings:
    get:
      summary: 获取当前客户设置与账号安全摘要
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: query,
            name: organizationId,
            required: false,
            schema: { type: string },
          }
      responses:
        "200": { description: 手机号仅返回脱敏值 }
  /v1/customer-center/addresses:
    get:
      summary: 获取当前客户地址簿
      description: 最多 50 个；联系人、手机号、详细地址仅对本人会话解密返回。
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: query,
            name: organizationId,
            required: false,
            schema: { type: string },
          }
      responses:
        "200": { description: 当前客户地址列表 }
    post:
      summary: 新增当前客户地址
      description: 敏感字段加密存储；每客户每组织最多 50 个地址，坐标必须为 GCJ-02。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerAddressCreate" }
      responses:
        "201": { description: 新增后的地址；首个地址自动设为默认 }
        "400": { description: 参数无效或地址数量达到上限 }
        "403": { description: 组织不可用于该客户 }
  /v1/customer-center/addresses/{id}:
    patch:
      summary: 修改当前客户自有地址
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerAddressUpdate" }
      responses:
        "200": { description: 更新后的地址 }
        "403": { description: 不能修改其他客户地址 }
        "404": { description: 地址不存在 }
    delete:
      summary: 删除当前客户自有地址
      description: 删除默认地址时，服务端自动选择同组织最近更新的剩余地址为默认。
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200": { description: 删除成功 }
        "403": { description: 不能删除其他客户地址 }
        "404": { description: 地址不存在 }
  /v1/customer-center/feedback:
    post:
      summary: 提交客户意见、投诉或售后反馈
      description: 正文和联系方式加密存储；按上海自然日每个客户最多 10 次。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerFeedbackCreate" }
      responses:
        "201": { description: 已受理，不回显敏感正文或联系方式 }
        "429": { description: 当日提交次数达到上限 }
  /v1/customer-center/account-deletion:
    get:
      summary: 查询当前平台账号最近的注销申请
      description: 注销申请按 customerId 全局查询，不因组织不同产生多份待处理申请。
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 最近申请或 null；不回显加密原因 }
    post:
      summary: 提交平台账号软注销申请
      description: 不硬删除用户、订单或审计；全局已有 PENDING 申请时幂等返回原申请。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/AccountDeletionRequestCreate" }
      responses:
        "201": { description: 新建或幂等返回的软注销申请 }
  /v1/admin/organizations/{organizationId}/customer-center/config:
    get:
      summary: 获取客户中心运营配置
      description: 需要该组织 customer-center.manage 权限；生产环境同时受员工 MFA 门禁约束。
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: path,
            name: organizationId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: 客户中心运营文案配置 }
        "403": { description: 无组织管理权限或 MFA 未满足 }
    patch:
      summary: 更新客户中心运营配置
      description: 所有修改写入审计；不接受密钥或支付配置。
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: path,
            name: organizationId,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerCenterConfigUpdate" }
      responses:
        "200": { description: 更新后的配置 }
        "403": { description: 无组织管理权限或 MFA 未满足 }
  /v1/admin/organizations/{organizationId}/customer-center/summary:
    get:
      summary: 获取客户中心运营汇总
      description: 需要 customer-center.manage；只返回聚合计数和金额，不返回地址、反馈正文、联系方式或注销原因。
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: path,
            name: organizationId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          description: 客户中心运营汇总
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    { $ref: "#/components/schemas/AdminCustomerCenterSummary" }
        "403": { description: 无组织管理权限或 MFA 未满足 }
components:
  requestBodies:
    BrowserLoginProof:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [pairCode, browserSecret]
            properties:
              pairCode: { type: string, pattern: "^[A-Za-z0-9_-]{22}$" }
              browserSecret:
                {
                  type: string,
                  pattern: "^[A-Za-z0-9_-]{43}$",
                  writeOnly: true,
                }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    CustomerCenterContent:
      type: object
      required:
        [
          levelLabel,
          customerServicePhone,
          cityNewsTitle,
          cityNewsContent,
          appBannerTitle,
          appBannerSubtitle,
          appDownloadUrl,
          safeguardItems,
          updatedAt,
        ]
      properties:
        levelLabel: { type: string, minLength: 1, maxLength: 32 }
        customerServicePhone: { type: [string, "null"] }
        cityNewsTitle: { type: string, minLength: 1, maxLength: 80 }
        cityNewsContent: { type: string, minLength: 1, maxLength: 300 }
        appBannerTitle: { type: string, minLength: 1, maxLength: 80 }
        appBannerSubtitle: { type: string, minLength: 1, maxLength: 160 }
        appDownloadUrl:
          { type: [string, "null"], format: uri, pattern: "^https://" }
        safeguardItems:
          type: array
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 80 }
        updatedAt: { type: [string, "null"], format: date-time }
    CustomerCenterOrderCounts:
      type: object
      required: [pendingPayment, inProgress, pendingReview, cancelled]
      properties:
        pendingPayment: { type: integer, minimum: 0 }
        inProgress: { type: integer, minimum: 0 }
        pendingReview: { type: integer, minimum: 0 }
        cancelled: { type: integer, minimum: 0 }
    CustomerCenterOverview:
      type: object
      required: [organizationId, profile, benefits, orders, content]
      properties:
        organizationId: { type: string }
        profile:
          type: object
          required:
            [
              userId,
              displayName,
              avatarUrl,
              levelLabel,
              registeredAt,
              phoneVerified,
            ]
          properties:
            userId: { type: string }
            displayName: { type: string }
            avatarUrl: { type: [string, "null"], format: uri }
            levelLabel: { type: string }
            registeredAt: { type: string, format: date-time }
            phoneVerified: { type: boolean }
        benefits:
          type: object
          required: [availableCouponCount, availableCardCount, maskedBalance]
          properties:
            availableCouponCount: { type: integer, minimum: 0 }
            availableCardCount: { type: integer, minimum: 0 }
            maskedBalance: { type: string, const: "****" }
        orders: { $ref: "#/components/schemas/CustomerCenterOrderCounts" }
        content: { $ref: "#/components/schemas/CustomerCenterContent" }
    CustomerCoupon:
      type: object
      required:
        [
          id,
          organizationId,
          title,
          amountFen,
          minimumSpendFen,
          applicability,
          canApplyToTravelFee,
          validFrom,
          expiresAt,
          status,
          usedAt,
        ]
      properties:
        id: { type: string }
        organizationId: { type: string }
        title: { type: string }
        amountFen: { type: integer, minimum: 0 }
        minimumSpendFen: { type: integer, minimum: 0 }
        applicability: { type: string }
        canApplyToTravelFee: { type: boolean }
        validFrom: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        status: { type: string, enum: [AVAILABLE, USED, EXPIRED] }
        usedAt: { type: [string, "null"], format: date-time }
    CustomerWallet:
      type: object
      required: [organizationId, balanceFen, cards, recharge]
      properties:
        organizationId: { type: string }
        balanceFen: { type: integer, minimum: 0 }
        cards:
          type: array
          items:
            type: object
            required: [id, name, type, balanceFen, status, expiresAt]
            properties:
              id: { type: string }
              name: { type: string }
